[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dronedet"
version = "0.1.0"
description = "Compact acoustic drone detection: model, training recipe, and benchmark/field evaluation protocols"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "librosa>=0.10",
  "soundfile>=0.12",
  "scikit-learn>=1.1",
  "torch>=2.0",
  "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dronedet-detect = "dronedet.detect:main"
dronedet-train = "dronedet.train:main"
dronedet-eval = "dronedet.evaluate:main"
dronedet-synth = "dronedet.synth:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
